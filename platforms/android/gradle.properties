org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# On for the instrumentation runner only. Nothing AndroidX reaches the shipped
# APK — `./gradlew :app:dependencies --configuration releaseRuntimeClasspath`
# lists the Kotlin stdlib and nothing else.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
