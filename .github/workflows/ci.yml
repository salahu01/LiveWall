name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # The app targets macOS 14, so any current macOS runner will do. Pinning to
    # a specific one (macos-15) sat unassigned for 11 minutes and then failed
    # without ever starting a step; `macos-latest` is the label that actually
    # gets scheduled.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/macos

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      # The suite is pure logic — coverage geometry, frame pacing, output
      # sizing, index decoding — so it needs no display, no GPU and no
      # media files, and runs on a headless runner.
      - name: Test
        run: swift test

      # Catches an unbuildable bundle, a missing icon or a broken plist, none
      # of which `swift build` would notice.
      - name: Assemble the app bundle
        run: ./tools/bundle.sh release

      - name: Check the bundle is well formed
        run: |
          APP=build/LiveWall.app
          test -x "$APP/Contents/MacOS/LiveWall"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"

  windows:
    # windows-latest ships the MSVC toolchain, the Windows SDK and CMake, which
    # is the whole dependency list — the port links only against libraries that
    # come with the SDK.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: platforms/windows

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # Same shape as the macOS suite: pure logic, so it needs no display, no
      # GPU, no Media Foundation session and no media files. What it cannot
      # cover on a runner is the WorkerW parenting and the decode path, both of
      # which need a real desktop session.
      - name: Test
        run: ctest --preset ci --output-on-failure

      - name: Check the executable is well formed
        run: |
          $exe = "out/build/ci/LiveWall.exe"
          if (-not (Test-Path $exe)) { throw "no executable at $exe" }
          "{0:N0} KB" -f ((Get-Item $exe).Length / 1KB)

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall-windows-x64
          path: platforms/windows/out/build/ci/LiveWall.exe
          if-no-files-found: error

  android:
    # ubuntu-latest ships a JDK and the Android SDK command-line tools, which is
    # the whole dependency list — the app links only against the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platforms/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Pure logic — frame pacing, output sizing, fit geometry, index decoding —
      # so it needs no emulator, no GPU and no media files. What it cannot cover
      # on a runner is the decode and transcode paths, which need a real codec;
      # those live in `androidTest` and run against a device.
      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      # Catches a broken manifest, a missing icon or an R8 rule that strips the
      # service — none of which compiling would notice.
      - name: Check the APK is well formed
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          echo "$(( $(stat -c%s "$APK") / 1024 )) KB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q "com.fegno.livewall.app.LiveWallService" manifest.txt
          grep -q "android.service.wallpaper.WallpaperService" manifest.txt
          grep -q "android.software.live_wallpaper" manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall-android
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  linux:
    # Unlike the other two jobs, this one installs packages — but only headers
    # and wayland-scanner. Everything optional at runtime (libav*, libva,
    # libdbus, libXss) is opened with dlopen and never reaches the link line,
    # which the "Check what it links against" step below verifies.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/linux

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libegl-dev libgles-dev libwayland-dev wayland-protocols \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libva-dev libdbus-1-dev \
            xvfb

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # Same shape as the other two suites: pure logic — coverage geometry,
      # frame pacing, output sizing, index decoding — so it needs no display,
      # no GPU, no decoder and no media files. What it cannot cover on a runner
      # is the X11 stacking, the layer-shell surface and the VA-API path, all
      # of which need a real session.
      - name: Test
        run: ctest --preset ci

      # The whole dependency argument in one command. libav*, libva, libdbus
      # and libXss must NOT appear here — if one does, an optional runtime
      # dependency has quietly become a required one and the binary will refuse
      # to start on a machine without it.
      - name: Check what it links against
        run: |
          exe=out/build/ci/livewall
          test -x "$exe"
          printf '%s KB\n' "$(( $(stat -c%s "$exe") / 1024 ))"
          ldd "$exe"
          if ldd "$exe" | grep -Eq 'libav(codec|format|util)|libswscale|libva|libdbus|libXss'; then
            echo "::error::a dlopen-only library ended up on the link line"
            exit 1
          fi

      # Catches an unusable binary, a broken control socket and a shader that
      # does not compile — none of which `ctest` would notice, since the suite
      # deliberately needs no display.
      - name: Smoke test under Xvfb
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          export DISPLAY=:99
          exe="$PWD/out/build/ci/livewall"
          "$exe" probe
          LIVEWALL_VERBOSE=1 "$exe" &
          sleep 5
          "$exe" status
          # The daemon reporting anything other than "Rendering" here means a
          # gate fired on a headless runner, which would be a bug in the gate.
          "$exe" status | grep -q '^state       Rendering'
          "$exe" quit

      # Builds the configuration a machine with no libwayland gets, so the
      # #if LIVEWALL_HAS_WAYLAND paths cannot rot.
      - name: Build without the Wayland backend
        run: |
          cmake --preset no-wayland
          cmake --build --preset no-wayland

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall-linux-x64
          path: platforms/linux/out/build/ci/livewall
          if-no-files-found: error
